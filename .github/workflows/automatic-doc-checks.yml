name: Main Documentation Checks

on:
  - push
  - pull_request
  - workflow_dispatch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation-checks:
    uses: canonical/documentation-workflows/.github/workflows/documentation-checks.yaml@main
    with:
      working-directory: 'doc/'

  spelling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - run: python3 -m venv doc/.sphinx/venv
      - run: source doc/.sphinx/venv/bin/activate
      - run: pip install -r doc/.sphinx/requirements.txt
      # - run: pip install sphinxcontrib-spelling
      - run: cd doc && make spellcheck
      # - run: cat doc/_build/spelling/output.txt
  vale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - run: pip install -r doc/.sphinx/requirements.txt
      - run: cd doc && make vale
